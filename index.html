<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>Super Platformer</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#fff;font-family:system-ui,Arial;touch-action:none}#game{display:block;width:100%;height:100%;background:#80d9f5}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:0 2px 3px #123;font-weight:800;font-size:clamp(14px,2.5vw,20px)}.pill{background:#101827bb;border:1px solid #ffffff40;border-radius:14px;padding:8px 12px}#menu{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#07142699,#071426dd);padding:20px}#panel{max-width:440px;width:100%;text-align:center;background:#14243a;border:1px solid #ffffff30;border-radius:24px;padding:26px;box-shadow:0 20px 70px #0008}h1{font-size:clamp(30px,8vw,48px);margin:0 0 8px;color:#ffe16b}p{line-height:1.45;color:#d7e5f5}button{border:0;border-radius:14px;background:#ffd447;color:#282018;font-weight:900;font-size:17px;padding:13px 22px;cursor:pointer;box-shadow:0 4px 0 #b67d18}button:active{transform:translateY(3px);box-shadow:0 1px 0 #b67d18}#controls{position:fixed;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.cluster{display:flex;gap:12px}.ctrl{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:#14243acc;color:white;border:2px solid #ffffff99;font-size:27px;box-shadow:0 4px 0 #09111d99;touch-action:none;user-select:none}.ctrl.small{width:56px;height:56px;font-size:21px}#hint{font-size:12px;color:#a9c3dc;margin-top:14px}@media(min-width:850px){#controls{opacity:.7}.ctrl{width:60px;height:60px}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">МИР <span id="level">1</span> · ❤️ <span id="lives">3</span></div><div class="pill">⭐ <span id="score">0</span></div></div><div id="menu"><div id="panel"><h1>SUPER<br>PLATFORMER</h1><p>Пробегай уровни, собирай монеты и звёзды, прыгай по платформам и обходи врагов. Доберись до флага!</p><button id="start">НАЧАТЬ ИГРУ</button><div id="hint">Телефон: кнопки снизу · Компьютер: A/D или ←/→, прыжок — W/↑/Пробел</div></div></div><div id="controls"><div class="cluster"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div><div class="cluster"><button class="ctrl small" id="pause">Ⅱ</button><button class="ctrl" data-key="jump">⬆</button></div></div>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d');let W=innerWidth,H=innerHeight,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys={left:false,right:false,jump:false};let running=false,paused=false,coins=0,score=0,lives=3,level=1,camera=0,last=0,acc=0;const player={x:70,y:0,vx:0,vy:0,w:30,h:42,ground:false,face:1,inv:0};
let platforms=[],items=[],enemies=[],goal=0,worldW=2400;
function build(){worldW=2300+level*280;platforms=[{x:0,y:H-70,w:worldW,h:100}];let x=210;while(x<worldW-260){let y=H-150-Math.random()*Math.min(150,H*.22);platforms.push({x,y,w:100+Math.random()*100,h:18});if(Math.random()>.3)platforms.push({x:x+210,y:y+65,w:90,h:18});x+=300+Math.random()*90}items=[];for(let x=150;x<worldW-220;x+=125){let p=platforms.filter(p=>p.x<=x&&p.x+p.w>=x).sort((a,b)=>a.y-b.y)[0];items.push({x,y:(p?p.y:H-70)-35,type:Math.random()>.12?'coin':'star',got:false})}enemies=[];for(let x=450;x<worldW-250;x+=430)enemies.push({x,y:H-112,v:1.1+level*.12,alive:true,base:x});goal=worldW-110;player.x=70;player.y=H-150;player.vx=player.vy=0;camera=0}
function ui(){document.getElementById('coins').textContent=coins;document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;document.getElementById('level').textContent=level}
function start(){document.getElementById('menu').style.display='none';running=true;paused=false;build();last=performance.now();requestAnimationFrame(loop)}
document.getElementById('start').onclick=start;document.getElementById('pause').onclick=()=>{if(!running)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ'};
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const set=v=>{keys[k]=v};b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>set(false)))});
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w','A','D','W'].includes(e.key))e.preventDefault();if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if(['ArrowUp','w','W',' '].includes(e.key))keys.jump=true;if(e.key==='Escape')paused=!paused});
addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false;if(['ArrowUp','w','W',' '].includes(e.key))keys.jump=false});
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x-camera,y,w,h)}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#63c9f0');sky.addColorStop(1,'#d8f5ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
for(let i=0;i<9;i++){let x=((i*310-camera*.28)%(W+260)+W+260)%(W+260)-120;ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.arc(x,100+(i%3)*48,24,0,7);ctx.arc(x+28,94+(i%3)*48,30,0,7);ctx.arc(x+58,103+(i%3)*48,21,0,7);ctx.fill()}
for(let i=0;i<8;i++){let x=((i*370-camera*.5)%(W+400)+W+400)%(W+400)-160;ctx.fillStyle='#55b88a';ctx.beginPath();ctx.moveTo(x,H-70);ctx.lineTo(x+170,H-230-(i%3)*40);ctx.lineTo(x+340,H-70);ctx.fill()}
platforms.forEach(p=>{if(p.x+p.w<camera-30||p.x>camera+W+30)return;rect(p.x,p.y,p.w,p.h,'#8a542b');rect(p.x,p.y,p.w,7,'#44b94e');for(let xx=p.x+12;xx<p.x+p.w;xx+=28)rect(xx,p.y+13,12,4,'#bd8250')});
items.forEach(o=>{if(o.got)return;let x=o.x-camera;if(x<-30||x>W+30)return;ctx.fillStyle=o.type==='star'?'#ffdf38':'#ffb51b';ctx.beginPath();if(o.type==='star'){for(let j=0;j<10;j++){let a=-Math.PI/2+j*Math.PI/5,r=j%2?7:14;ctx.lineTo(x+Math.cos(a)*r,o.y+Math.sin(a)*r)}}else ctx.arc(x,o.y,10,0,7);ctx.fill()});
enemies.forEach(e=>{if(!e.alive)return;let x=e.x-camera;ctx.fillStyle='#9a4aaf';ctx.beginPath();ctx.roundRect(x-15,e.y-17,30,30,9);ctx.fill();ctx.fillStyle='white';ctx.fillRect(x-8,e.y-8,5,7);ctx.fillRect(x+4,e.y-8,5,7);ctx.fillStyle='#29142e';ctx.fillRect(x-6,e.y+8,12,3)});
rect(goal,H-160,8,90,'#f4f4f4');rect(goal+8,H-160,48,30,'#ffdf46');ctx.fillStyle='#ffdf46';ctx.beginPath();ctx.moveTo(goal+8-camera,H-160);ctx.lineTo(goal+54-camera,H-145);ctx.lineTo(goal+8-camera,H-130);ctx.fill();
if(player.inv<=0||Math.floor(performance.now()/100)%2===0){rect(player.x,player.y,player.w,player.h,'#e84a3b');rect(player.x+5,player.y+5,20,10,'#ffd1a3');rect(player.x+7,player.y+8,4,4,'#182334');rect(player.x+19,player.y+8,4,4,'#182334');rect(player.x+4,player.y+player.h-5,10,7,'#283b6b');rect(player.x+18,player.y+player.h-5,10,7,'#283b6b')}
}
function update(dt){if(!running||paused)return;let p=player;p.inv=Math.max(0,p.inv-dt);let dir=(keys.right?1:0)-(keys.left?1:0);p.vx=dir*260;if(dir)p.face=dir;if(keys.jump&&p.ground){p.vy=-590;p.ground=false}p.vy+=1500*dt;p.x+=p.vx*dt;p.x=Math.max(0,Math.min(worldW-p.w,p.x));let oldY=p.y;p.y+=p.vy*dt;p.ground=false;
for(let q of platforms){if(p.x+p.w>q.x&&p.x<q.x+q.w&&oldY+p.h<=q.y+8&&p.y+p.h>=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.ground=true}}
if(p.y>H+120){hurt()}
for(let o of items){if(!o.got&&Math.abs((p.x+p.w/2)-o.x)<24&&Math.abs((p.y+p.h/2)-o.y)<30){o.got=true;if(o.type==='star')score+=100;else{coins++;score+=10}ui()}}
for(let e of enemies){if(!e.alive)continue;e.x+=e.v*dt;if(Math.abs(e.x-e.base)>85)e.v*=-1;if(p.x+p.w>e.x-14&&p.x<e.x+14&&p.y+p.h>e.y-16&&p.y<e.y+12){if(p.vy>100&&p.y+p.h<e.y+15){e.alive=false;p.vy=-350;score+=50;ui()}else if(p.inv<=0)hurt()}}
if(p.x>goal-20){level++;score+=250;ui();build()}
camera=Math.max(0,Math.min(worldW-W,p.x-W*.35))}
function hurt(){if(player.inv>0)return;lives--;ui();if(lives<=0){running=false;document.querySelector('#panel h1').innerHTML='ИГРА ОКОНЧЕНА';document.querySelector('#panel p').textContent='Счёт: '+score+' · Монеты: '+coins;document.getElementById('start').textContent='ИГРАТЬ СНОВА';document.getElementById('menu').style.display='grid';coins=0;score=0;lives=3;level=1;ui()}else{player.x=Math.max(20,player.x-100);player.y=H-180;player.vy=0;player.inv=1.5}}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}build();draw();ui();
})();
</script></body></html>
